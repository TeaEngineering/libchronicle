name: CMake

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: LLVM upgrade
      shell: bash
      run: sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
    - name: Prep
      shell: bash
      run: sudo apt install libcmocka-dev libarchive-dev
    - name: Build
      shell: bash
      run: make -C native
    - name: Build
      shell: bash
      run: make -C native check-format
    - name: Test
      shell: bash
      run: make -C native test
